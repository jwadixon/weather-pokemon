name: Render frame

on:
  # Started on time by cron-job.org at :50 each hour, 05:50 to 21:50 UK time,
  # through GitHub's "workflow_dispatch" API. GitHub's own schedule runs up to
  # an hour late, so it isn't used. The "Run workflow" button still works too.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - name: Keep PokéAPI downloads between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/weather-pokemon
          key: pokeapi-${{ github.run_id }}
          restore-keys: pokeapi-

      - run: pip install requests pillow

      - run: python render_frame.py

      - name: Publish to GitHub Pages
        if: hashFiles('site/now.png') != ''   # skipped hours publish nothing
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true   # keep only the latest images, no history
